<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Science Tutor AI</title>
  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: green;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: darkgreen;
    }

    #out {
      margin-top: 15px;
      padding: 10px;
      background: #eee;
      min-height: 50px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>🧠 Science Tutor AI</h2>

  <input id="msg" placeholder="Ask your science question...">

  <button onclick="send()">Ask AI</button>

  <div id="out">Answer will appear here...</div>
</div>

<script>
const API_URL = "https://science-tutor-ai-djfa.onrender.com";

async function send() {
  let message = document.getElementById("msg").value;
  let output = document.getElementById("out");

  output.innerText = "Thinking... 🤖";

  try {
    let res = await fetch(API_URL + "/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    let data = await res.json();

    if (data.reply) {
      output.innerText = data.reply;
    } else {
      output.innerText = "No response from AI.";
    }

  } catch (error) {
    output.innerText = "Error connecting to AI server.";
  }
}
</script>

</body>
</html>
